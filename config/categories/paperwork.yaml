category_name: paperwork
display_name: 서류/행정 레이더
data_quality:
  priority: P0
  primary_motion: compliance-risk
  weakest_dimension: operational_depth
  quality_outputs:
    freshness_report: reports/paperwork_quality.json
    dated_freshness_report_pattern: reports/paperwork_YYYYMMDD_quality.json
    document_diff_report: reports/document_diffs/paperwork_document_diffs.json
    dated_document_diff_report_pattern: reports/document_diffs/paperwork_YYYYMMDD_document_diffs.json
    tracked_event_models: [form_revision, filing_deadline, portal_service_change]
  event_models:
    form_revision:
      fields: [jurisdiction, issuing_agency, form_number, form_title, revision_date, document_url, content_hash, source_url, collected_at]
      notes: "서식 원본 파일과 안내문 변경을 diff 가능한 이벤트로 취급한다."
    filing_deadline:
      fields: [jurisdiction, issuing_agency, filing_type, due_date, effective_date, source_url, collected_at]
      notes: "제출 마감일·시행일·public comment 종료일을 별도 운영 이벤트로 유지한다."
    portal_service_change:
      fields: [portal, service_id, service_name, requirement_summary, changed_at, source_url, collected_at]
      notes: "정부 포털의 신청 절차·필수 첨부서류·수수료 변경을 추적한다."
  canonical_keys:
    form:
      fields: [jurisdiction, issuing_agency, normalized_form_title, form_number, document_url]
      notes: "서식명이 같아도 발행기관·관할권이 다르면 별도 entity로 분리한다."
    deadline:
      fields: [jurisdiction, issuing_agency, filing_type, due_date, source_url]
      notes: "마감일 추적과 stale deadline 제거용 key."
    portal_service:
      fields: [portal, service_id, normalized_service_name, jurisdiction]
      notes: "정부24/하이코리아 등 포털형 service catalog 정규화 기준."
  freshness_sla:
    form_revision:
      max_age_days: 3
      event_date_field: revision_date
      observed_date_field: collected_at
    filing_deadline:
      max_age_days: 2
      event_date_field: due_date
      observed_date_field: collected_at
    portal_service_change:
      max_age_days: 4
      event_date_field: changed_at
      observed_date_field: collected_at
  quality_gates:
    - "문서 hash와 원본 URL을 함께 저장"
    - "서식명만 같고 발행기관이 다른 문서를 별도 entity로 분리"
    - "개정일이 없으면 수집일 기준 provisional 상태로 표시"
    - "뉴스 해설과 실제 제출 마감/서식 변경 이벤트를 같은 신뢰 등급으로 병합하지 않음"
source_backlog:
  form_diff_candidates:
    - id: uscis_forms_updates_html
      name: "USCIS Forms Updates"
      url: https://www.uscis.gov/forms/forms-updates
      reason: "RSS 403으로 비활성화된 고가치 서식 변경 source. HTML/browser fixture와 문서 hash diff 검증 후 재활성화."
      required_before_enable: [browser_fixture_test, document_hash_diff, edition_date_parser]
    - id: irs_forms_publications
      name: "IRS Forms and Publications"
      url: https://www.irs.gov/forms-instructions-and-publications
      reason: "세금 서식·instructions 개정 추적 후보. PDF/document hash와 filing year canonicalization 필요."
      required_before_enable: [document_hash_diff, filing_year_key, api_or_html_path]
  deadline_calendar_candidates:
    - id: irs_tax_deadlines
      name: "IRS Filing Deadlines"
      url: https://www.irs.gov/filing
      reason: "세금 신고 마감일 운영 calendar 후보. 일반 news feed와 분리해 due_date event로 적재 필요."
      required_before_enable: [deadline_parser, timezone_policy, stale_deadline_check]
    - id: uk_companies_house_filing_deadlines
      name: "Companies House Filing Deadlines"
      url: https://www.gov.uk/government/organisations/companies-house
      reason: "회사 서류 제출기한과 filing requirement 변경 후보."
      required_before_enable: [deadline_parser, company_filing_taxonomy, evidence_url_check]
sources:
