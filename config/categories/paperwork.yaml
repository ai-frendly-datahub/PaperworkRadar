- name: Federal Register Documents
  type: rss
  url: https://www.federalregister.gov/api/v1/documents.rss?order=newest
  language: en
  country: US
  trust_tier: T1_official
  collection_tier: C1_rss
  content_type: rulemaking_notice
  producer_role: government
  info_purpose: [rulemaking, public_comment, filing_requirement, filing_deadline, operational_event]
  notes: "공식 rulemaking feed. public comment 종료일·시행일·filing requirement 변경 후보를 추적."
  config:
    event_model: filing_deadline
    event_date_field: published
    observed_date_field: collected_at
    canonical_key_fields: [jurisdiction, issuing_agency, filing_type, source_url]
    freshness_sla_days: 2
